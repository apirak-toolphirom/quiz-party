services:
  quiz-party:
    build: .
    container_name: quiz-party
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ลิงก์ที่ใส่ใน QR code (ใส่ IP/โดเมนที่มือถือเข้าถึงได้) เช่น http://192.168.1.50:3000
      - PUBLIC_URL=
      # รหัสผู้จัด (เว้นว่าง = ไม่ต้องใส่รหัส)
      - HOST_KEY=
    volumes:
      - ./data:/app/data
